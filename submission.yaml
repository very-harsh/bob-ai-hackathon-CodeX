submission:
  title: "Evidence Prioritisation Dashboard"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
   The problem is unordered list of evidenced found at the crime scene during crime scene investigation by the investigators.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    we have built an IBM BOB powered assistant that takes the list of evidences as input.
    It gives a Structured and ordered list of evidences according to the priority required for the evidencege

